<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4834d4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="أقوى توقعات المباريات اليومية">
<title>TiKOXPRO VIP</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --primary:#6c5ce7; --dark-purple:#4834d4;
  --gold:#f1c40f; --gold-dark:#f39c12;
  --green-c:#25D366; --telegram:#0088cc;
  --destructive:#e74c3c;
  --bg:hsl(248,35%,95%);
  --card-bg:#fff; --text:#000; --text-muted:#666;
  --border:#e0e0e0; --muted-bg:#f5f5f5; --input-border:#d0d0d0;
}
[data-theme="dark"]{
  --bg:hsl(248,35%,5%);
  --card-bg:#111; --text:#fff; --text-muted:#aaa;
  --border:#333; --muted-bg:#1a1a1a; --input-border:#444;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Cairo',sans-serif;color:var(--text);
  min-height:100vh;padding-bottom:110px;
  transition:background-color .3s,color .3s;
  background-color:var(--bg);
  background-image:
    radial-gradient(ellipse 100% 45% at 50% 0%,hsla(248,73%,56%,.20) 0%,transparent 60%),
    radial-gradient(ellipse 50% 50% at 100% 100%,hsla(45,100%,51%,.12) 0%,transparent 55%),
    radial-gradient(circle at center,hsla(248,60%,35%,.28) 1.5px,transparent 1.5px);
  background-size:100% 100%,100% 100%,22px 22px;
  background-repeat:no-repeat,no-repeat,repeat;
}
[data-theme="dark"] body{
  background-image:
    radial-gradient(ellipse 100% 50% at 50% 0%,hsla(248,73%,56%,.42) 0%,transparent 60%),
    radial-gradient(ellipse 60% 55% at 100% 100%,hsla(45,100%,51%,.16) 0%,transparent 55%),
    radial-gradient(ellipse 45% 45% at 0% 90%,hsla(248,60%,50%,.22) 0%,transparent 55%),
    radial-gradient(circle at center,hsla(248,73%,70%,.26) 1.5px,transparent 1.5px);
  background-size:100% 100%,100% 100%,100% 100%,22px 22px;
  background-repeat:no-repeat,no-repeat,no-repeat,repeat;
}
header{background:linear-gradient(135deg,var(--dark-purple),var(--primary));color:#fff;padding:3rem 1rem 2rem;text-align:center;position:relative;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.18);}
header h1{font-size:2.5rem;font-weight:900;letter-spacing:-1px;position:relative;z-index:1;}
header p{font-size:1.05rem;font-weight:700;opacity:.9;margin-top:.4rem;position:relative;z-index:1;}
.controls-top{position:absolute;top:14px;left:14px;display:flex;gap:8px;z-index:10;}
.icon-btn{background:rgba(255,255,255,.22);border:none;border-radius:50%;width:40px;height:40px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.1rem;color:#fff;transition:background .2s;}
.admin-btn{position:absolute;top:14px;right:14px;background:transparent;border:none;color:rgba(255,255,255,.3);cursor:pointer;font-size:1.1rem;z-index:10;}
.container{max-width:520px;margin:auto;padding:1rem;}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0;}
.stat-card{background:var(--card-bg);border:1px solid var(--border);border-radius:14px;padding:10px 6px;text-align:center;}
.stat-val{font-size:1.2rem;font-weight:900;}
.stat-label{font-size:10px;color:var(--text-muted);font-weight:700;margin-top:2px;}
.c-green{color:#27ae60;}.c-primary{color:var(--primary);}.c-red{color:var(--destructive);}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;background:rgba(0,0,0,.06);border-radius:14px;padding:5px;margin:0 0 20px;}
.tab-btn{padding:11px 6px;border:none;border-radius:10px;cursor:pointer;font-weight:900;font-family:'Cairo',sans-serif;font-size:.9rem;background:transparent;color:var(--text-muted);}
.tab-btn.active-free{background:var(--primary);color:#fff;}
.tab-btn.active-vip{background:var(--gold);color:#000;}
.tab-btn.active-results{background:#27ae60;color:#fff;}
.section{display:none;}.section.active{display:block;}
.match-card{background:var(--card-bg);border-radius:18px;margin-bottom:16px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.09);}
.match-card.vip-card{border:2px solid var(--gold);}
.teams-row{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);}
.team-name{font-weight:900;font-size:1.05rem;}
.vs-badge{background:rgba(108,92,231,.13);color:var(--primary);font-weight:900;font-size:.85rem;padding:4px 12px;border-radius:8px;}
.prediction-box{background:var(--primary);color:#fff;padding:15px 20px;text-align:center;font-weight:900;}
.prediction-box.gold-box{background:linear-gradient(90deg,var(--gold),var(--gold-dark));color:#000;}
.card-footer{padding:10px 18px 14px;background:var(--card-bg);display:flex;flex-direction:column;gap:8px;}
.conf-row{display:flex;align-items:center;gap:8px;}
.conf-bar-track{flex:1;background:var(--muted-bg);border-radius:50px;height:5px;overflow:hidden;}
.conf-bar-fill{height:100%;border-radius:50px;}
.vip-gate{background:var(--card-bg);border-radius:20px;padding:28px 20px;text-align:center;border:1px solid var(--border);}
.tg-btn{position:fixed;bottom:18px;left:14px;right:14px;background:var(--telegram);color:#fff;padding:15px 22px;border-radius:50px;text-decoration:none;font-weight:900;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.22);z-index:500;}
.toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:11px 22px;border-radius:10px;opacity:0;transition:opacity .3s;z-index:9999;}
.toast.show{opacity:1;}
</style>
</head>
<body>

<header>
  <div class="controls-top">
    <button class="icon-btn" onclick="toggleTheme()" id="themeBtn">🌙</button>
    <button class="icon-btn" onclick="toggleLang()">🌐</button>
  </div>
  <h1>TiKOXPRO VIP</h1>
  <p id="appSubtitle">أقوى توقعات المباريات اليومية</p>
</header>

<div class="container">
  <div class="stats-grid" id="statsGrid"></div>

  <div class="tabs">
    <button class="tab-btn active-free" id="tabFreeBtn" onclick="showTab('free')">مجاني</button>
    <button class="tab-btn" id="tabVipBtn" onclick="showTab('vip')">👑 VIP</button>
    <button class="tab-btn" id="tabResBtn" onclick="showTab('results')">📈 النتائج</button>
  </div>

  <div id="sec-free" class="section active">
    <div id="freeMatchesContainer"></div>
  </div>

  <div id="sec-vip" class="section">
    <div id="vip-gate" class="vip-gate">
      <h2 style="color:var(--gold);font-weight:900;font-size:1.9rem;margin-bottom:20px;">قسم المحترفين</h2>
      <input type="text" id="codeInput" style="width:100%;padding:13px;border-radius:10px;border:2px solid var(--border);text-align:center;margin-bottom:10px;" placeholder="TiKO...">
      <button onclick="activateCode()" style="width:100%;padding:14px;background:var(--primary);color:#fff;border:none;border-radius:12px;font-weight:900;cursor:pointer;">تفعيل الكود</button>
    </div>
    <div id="vip-content" style="display:none">
      <div id="vipMatchesContainer"></div>
      <button onclick="logout()" style="width:100%;padding:10px;background:transparent;color:red;border:1px solid red;border-radius:10px;margin-top:10px;cursor:pointer;">تسجيل الخروج</button>
    </div>
  </div>

  <div id="sec-results" class="section">
    <div id="historyContainer"></div>
  </div>
</div>

<a href="https://t.me/+TGctJjTcepxlZTFk" target="_blank" class="tg-btn">🚀 قناتنا تليجرام للمزيد</a>
<div class="toast" id="toast"></div>

<script>
let lang = "ar", theme = "light";
// إضافة المباريات الجديدة هنا
let allMatches = [
  { id: 1, team1: "Brighton", team2: "Newcastle", predictionAr: "كلا الفريقين يسجلان", predictionEn: "Both Teams to Score", type: "free", confidence: 85, result: "pending", createdAt: "2026-05-02T10:00:00Z" },
  { id: 2, team1: "Fulham", team2: "Arsenal", predictionAr: "هنديكاب (1.5) لـ فولهام", predictionEn: "Handicap (1.5) Fulham", type: "free", confidence: 80, result: "pending", createdAt: "2026-05-02T10:01:00Z" },
  { id: 3, team1: "Heidenheim", team2: "Bayern", predictionAr: "كلا الفريقين يسجلان", predictionEn: "Both Teams to Score", type: "free", confidence: 88, result: "pending", createdAt: "2026-05-02T10:02:00Z" },
  { id: 4, team1: "A. Madrid", team2: "Valencia", predictionAr: "فالنسيا تسجل هدف", predictionEn: "Valencia to Score", type: "free", confidence: 75, result: "pending", createdAt: "2026-05-02T10:03:00Z" },
  { id: 5, team1: "Barcelona", team2: "Osasuna", predictionAr: "كلا الفريقين يسجلان", predictionEn: "Both Teams to Score", type: "free", confidence: 82, result: "pending", createdAt: "2026-05-02T10:04:00Z" },
  { id: 6, team1: "Levante", team2: "Villarreal", predictionAr: "ليفانتي تسجل هدف", predictionEn: "Levante to Score", type: "free", confidence: 70, result: "pending", createdAt: "2026-05-02T10:05:00Z" },
  { id: 7, team1: "Newcastle", team2: "Brighton", predictionAr: "فرصة مزدوجة برايتون", predictionEn: "Double Chance Brighton", type: "vip", confidence: 90, result: "pending", createdAt: "2026-05-02T10:06:00Z" },
  { id: 8, team1: "Leipzig", team2: "B. Leverkusen", predictionAr: "هنديكاب (1) لـ لايبزيغ", predictionEn: "Handicap (1) Leipzig", type: "vip", confidence: 85, result: "pending", createdAt: "2026-05-02T10:07:00Z" }
];

function renderStats() {
  const decided = allMatches.filter(m => m.result !== "pending");
  const won = decided.filter(m => m.result === "won").length;
  const winRate = decided.length > 0 ? Math.round((won / decided.length) * 100) : 100;
  document.getElementById("statsGrid").innerHTML = `
    <div class="stat-card"><div class="stat-val c-green">${winRate}%</div><div class="stat-label">الدقة</div></div>
    <div class="stat-card"><div class="stat-val c-primary">${allMatches.length}</div><div class="stat-label">الإجمالي</div></div>
    <div class="stat-card"><div class="stat-val c-green">${won}</div><div class="stat-label">ناجح</div></div>
    <div class="stat-card"><div class="stat-val c-red">${decided.length - won}</div><div class="stat-label">فاشل</div></div>`;
}

function matchCardHTML(m, isVip=false) {
  return `
  <div class="match-card ${isVip?'vip-card':''}">
    <div class="teams-row"><span class="team-name">${m.team1}</span><span class="vs-badge">VS</span><span class="team-name">${m.team2}</span></div>
    <div class="prediction-box ${isVip?'gold-box':''}">${lang==='ar'?m.predictionAr:m.predictionEn}</div>
    <div class="card-footer">
      <div class="conf-row">🎯 <div class="conf-bar-track"><div class="conf-bar-fill" style="width:${m.confidence}%;background:${isVip?'var(--gold)':'var(--primary)'}"></div></div> <span style="font-size:11px;font-weight:900">${m.confidence}%</span></div>
    </div>
  </div>`;
}

function renderMatches() {
  const free = allMatches.filter(m => m.type === "free" && m.result === "pending");
  const vip = allMatches.filter(m => m.type === "vip" && m.result === "pending");
  document.getElementById("freeMatchesContainer").innerHTML = free.map(m => matchCardHTML(m)).join("");
  document.getElementById("vipMatchesContainer").innerHTML = vip.map(m => matchCardHTML(m, true)).join("");
}

function showTab(tab) {
  ["free", "vip", "results"].forEach(s => document.getElementById(`sec-${s}`).classList.toggle("active", s === tab));
  document.getElementById("tabFreeBtn").className = "tab-btn" + (tab === "free" ? " active-free" : "");
  document.getElementById("tabVipBtn").className = "tab-btn" + (tab === "vip" ? " active-vip" : "");
  document.getElementById("tabResBtn").className = "tab-btn" + (tab === "results" ? " active-results" : "");
}

function activateCode() {
  const code = document.getElementById("codeInput").value;
  if(code.startsWith("TiKO")) {
    localStorage.setItem("tiko_expiry", Date.now() + 86400000);
    showVipContent();
  } else { alert("كود خاطئ"); }
}

function showVipContent() {
  document.getElementById("vip-gate").style.display = "none";
  document.getElementById("vip-content").style.display = "block";
}

function logout() { localStorage.removeItem("tiko_expiry"); location.reload(); }

window.onload = () => {
  if(localStorage.getItem("tiko_expiry") > Date.now()) showVipContent();
  renderStats();
  renderMatches();
};

function toggleTheme() {
  theme = theme === "light" ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", theme === "dark" ? "dark" : "");
}

function toggleLang() {
  lang = lang === "ar" ? "en" : "ar";
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  renderMatches();
}
</script>
</body>
</html>
